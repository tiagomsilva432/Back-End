name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, tests, deploy check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24


      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install


      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run test:types

      - name: Build
        run: npm run build


      - name: Tests
        run: npm test

      - name: Docker image builds
        run: docker build -t back-end:ci .


      - name: Smoke test the compiled build
        env:
          NODE_ENV: production
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: erp_ci
          JWT_SECRET: ci-only-not-a-real-secret
        run: |
          npm run db:migrate

          node dist/server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          if ! curl -fsS --retry 20 --retry-delay 1 --retry-connrefused \
               http://localhost:3000/health; then
            echo "--- server log ---"
            cat /tmp/server.log
            exit 1
          fi

          echo
          echo "Compiled build booted and answered on /health."
          kill "$(cat /tmp/server.pid)"
