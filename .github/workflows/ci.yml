name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json is deliberately gitignored, so `npm ci` is not an
      # option here - it refuses to run without a lockfile. setup-node's own
      # cache is keyed on one too, hence caching ~/.npm by hand instead: npm
      # then resolves versions over the network but downloads almost nothing.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      # Broader than `build`: covers src/ and tests/, which the SWC transform
      # used by Jest never type-checks.
      - name: Type-check
        run: npm run test:types

      # Proves the shippable output actually compiles, not just that types pass.
      - name: Build
        run: npm run build

      # Testcontainers starts a real postgres:18-alpine and runs the migrations
      # against it. ubuntu-latest already has Docker running, so nothing to set
      # up here — and a broken migration fails this step.
      - name: Tests
        run: npm test
